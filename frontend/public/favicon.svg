<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="argyrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1a17" />
      <stop offset="50%" stop-color="#121110" />
      <stop offset="100%" stop-color="#080706" />
    </linearGradient>

    <!-- Metallic Gold Foil Gradient for Monogram -->
    <linearGradient id="argyrGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7C4" />
      <stop offset="25%" stop-color="#DFC17B" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="75%" stop-color="#9E7632" />
      <stop offset="100%" stop-color="#C5A059" />
    </linearGradient>

    <!-- Outer Gold Border Gradient -->
    <linearGradient id="argyrBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC17B" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#C5A059" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#8C6239" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#DFC17B" stop-opacity="0.7" />
    </linearGradient>

    <!-- Radial Luxury Ambient Glow -->
    <radialGradient id="argyrGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#8C6239" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Charcoal Tile with Rounded Corners -->
  <rect width="512" height="512" rx="108" fill="url(#argyrBg)" />

  <!-- Ambient Luxury Glow -->
  <rect width="512" height="512" rx="108" fill="url(#argyrGlow)" />

  <!-- Outer Hairline Gold Border -->
  <rect x="18" y="18" width="476" height="476" rx="92" fill="none" stroke="url(#argyrBorder)" stroke-width="2.5" />

  <!-- Inner Artisan Leather Welt Stitch Dashed Line -->
  <rect x="28" y="28" width="456" height="456" rx="82" fill="none" stroke="#C5A059" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="7 5" />

  <!-- Top Accent Diamond -->
  <polygon points="256,44 260,48 256,52 252,48" fill="#C5A059" opacity="0.6" />

  <!-- Haute Couture Serif Monogram "A" -->
  <g fill="url(#argyrGold)">
    <!-- Main "A" Silhouette with bracketed serifs and inner counter -->
    <path fill-rule="evenodd" d="
      M 256 82
      C 264 82 272 85 277 92
      L 384 358
      C 388 368 393 374 404 376
      L 412 377
      L 412 390
      L 316 390
      L 316 377
      L 326 376
      C 336 374 340 367 337 358
      L 319 312
      L 193 312
      L 175 358
      C 172 367 176 374 186 376
      L 196 377
      L 196 390
      L 100 390
      L 100 377
      L 108 376
      C 119 374 124 368 128 358
      L 235 92
      C 240 85 248 82 256 82
      Z
      M 256 138
      L 204 278
      L 308 278
      Z
    " />

    <!-- Bespoke Crossbar Diamond Inset Embellishment -->
    <polygon points="256,268 263,278 256,288 249,278" fill="#181614" stroke="url(#argyrGold)" stroke-width="1.5" />
    <circle cx="256" cy="278" r="2.2" fill="#F7E7C4" />
  </g>

  <!-- ARGYR Wordmark at Base -->
  <g fill="url(#argyrGold)" opacity="0.95">
    <!-- Letter A -->
    <path d="M 148 440 L 155 422 L 157 422 L 164 440 L 161.5 440 L 159.2 434 L 152.8 434 L 150.5 440 Z M 153.5 432 L 158.5 432 L 156 425.5 Z" />
    <!-- Letter R -->
    <path d="M 188 440 L 188 422 L 196.5 422 C 200.5 422 203 424 203 427.5 C 203 430.5 201 432.2 198 432.8 L 203.5 440 L 200.5 440 L 195.5 433.2 L 190.8 433.2 L 190.8 440 Z M 190.8 431.2 L 196 431.2 C 198.8 431.2 200.2 429.8 200.2 427.5 C 200.2 425.2 198.8 424 196 424 L 190.8 424 Z" />
    <!-- Letter G -->
    <path d="M 235 431 C 235 425.5 231 421.8 225.5 421.8 C 219.5 421.8 215.5 426 215.5 431 C 215.5 436.2 219.5 440.2 225.8 440.2 C 230 440.2 233.5 438 234.5 434.5 L 231.8 434.5 C 231 436.5 228.8 438 225.8 438 C 221.2 438 218.2 434.8 218.2 431 C 218.2 427.2 221.2 424 225.5 424 C 229 424 231.5 426.2 232.2 429.5 L 225 429.5 L 225 431.5 L 235 431.5 Z" />
    <!-- Letter Y -->
    <path d="M 256 440 L 256 432.5 L 249 422 L 252.2 422 L 257.5 430.2 L 262.8 422 L 266 422 L 259 432.5 L 259 440 Z" />
    <!-- Letter R -->
    <path d="M 285 440 L 285 422 L 293.5 422 C 297.5 422 300 424 300 427.5 C 300 430.5 298 432.2 295 432.8 L 300.5 440 L 297.5 440 L 292.5 433.2 L 287.8 433.2 L 287.8 440 Z M 287.8 431.2 L 293 431.2 C 295.8 431.2 297.2 429.8 297.2 427.5 C 297.2 425.2 295.8 424 293 424 L 287.8 424 Z" />
  </g>

  <!-- Delicate flanking dots for wordmark -->
  <circle cx="132" cy="431" r="1.8" fill="#C5A059" opacity="0.7" />
  <circle cx="316" cy="431" r="1.8" fill="#C5A059" opacity="0.7" />
</svg>